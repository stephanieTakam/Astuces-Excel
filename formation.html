<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="pt">Formation — Astuces Excel</title>
  <meta name="description" id="pd" content="Formation Excel gratuite en vidéo."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/nav.css"/>
  <link rel="stylesheet" href="css/detail.css"/>
  <style> body { padding-top:70px; } </style>
</head>
<body>
<div id="nav-root"></div>
<div id="root"></div>
<div id="footer-root"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('nav-root').innerHTML    = navHTML();
  document.getElementById('footer-root').innerHTML = footerHTML();

  const id  = new URLSearchParams(location.search).get('id');
  const f   = DATA.formations.find(x => x.id === id);

  function getBadge(n) {
    return n === 'Avancé' ? 'badge-gold' : n === 'Débutant' ? 'badge-green' : 'badge-dim';
  }

  function afficherPage() {
    if (!f) {
      document.getElementById('root').innerHTML = `
        <div style="text-align:center;padding:8rem 2rem;color:var(--blanc-muted);">
          <div style="font-size:3rem;margin-bottom:1rem">😕</div>
          <h2 style="font-family:var(--font-display);color:var(--blanc);margin-bottom:1.5rem">Formation introuvable</h2>
          <a href="formations.html" class="btn btn-ghost">← Retour aux formations</a>
        </div>`;
      return;
    }

    document.getElementById('pt').textContent = f.titre + ' — Astuces Excel';
    document.getElementById('pd').content     = f.desc;

    // Formation payante
    if (!f.gratuit) {
      document.getElementById('root').innerHTML = `
        <div class="detail-hero">
          <div class="detail-hero-inner">
            <div class="breadcrumb">
              <a href="index.html">Accueil</a><span>/</span>
              <a href="formations.html">Formations</a><span>/</span>
              <span>${f.titre}</span>
            </div>
            <div class="detail-badges">
              <span class="badge badge-gold">⭐ Premium</span>
              <span class="badge ${getBadge(f.niveau)}">${f.niveau}</span>
            </div>
            <h1 class="detail-title">${f.titre}</h1>
            <p class="detail-desc">${f.desc}</p>
            <div class="detail-meta">
              <div class="detail-meta-item">🕐 <strong>${f.duree}</strong></div>
              <div class="detail-meta-item">🔒 <strong>${f.nbVideos} vidéos</strong></div>
            </div>
          </div>
        </div>
        <div style="max-width:560px;margin:4rem auto;padding:0 var(--px);">
          <div class="locked-box">
            <div class="locked-icon">🔒</div>
            <h3 class="locked-h">Formation Premium</h3>
            <p class="locked-p">Cette formation est disponible au prix de <strong style="color:#ffc107">${f.prix}</strong>. Accès à vie, ${f.nbVideos} vidéos HD.</p>
            <a href="${f.selarUrl}" target="_blank" class="btn-buy">🛒 Acheter — ${f.prix}</a>
            <p class="locked-note">Paiement sécurisé via Selar.co · Mobile Money accepté</p>
          </div>
          <div style="text-align:center;margin-top:1.5rem;">
            <a href="formations.html" style="font-size:.85rem;color:var(--blanc-muted);">← Voir les formations gratuites</a>
          </div>
        </div>`;
      return;
    }

    // Formation gratuite
    let vi = 0;

    document.getElementById('root').innerHTML = `
      <div class="detail-hero">
        <div class="detail-hero-inner">
          <div class="breadcrumb">
            <a href="index.html">Accueil</a><span>/</span>
            <a href="formations.html">Formations</a><span>/</span>
            <span>${f.titre}</span>
          </div>
          <div class="detail-badges">
            <span class="badge badge-green">✓ Gratuit</span>
            <span class="badge ${getBadge(f.niveau)}">${f.niveau}</span>
          </div>
          <h1 class="detail-title">${f.titre}</h1>
          <p class="detail-desc">${f.desc}</p>
          <div class="detail-meta">
            <div class="detail-meta-item">🕐 <strong>${f.duree}</strong></div>
            <div class="detail-meta-item">▶ <strong>${f.nbVideos} vidéos</strong></div>
          </div>
        </div>
      </div>
      <div class="detail-layout">
        <div class="detail-main">
          <div class="videos-list" id="vlist"></div>
        </div>
        <div class="detail-sidebar">
          <div class="player-wrap">
            <iframe id="player" src="${f.videos[0].url}?autoplay=0"
              allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"
              allowfullscreen></iframe>
            <div class="player-label" id="player-label">${f.videos[0].titre}</div>
          </div>
          <div class="player-nav">
            <button class="player-nav-btn" id="btn-prev" onclick="pick(vi-1)" disabled>← Précédente</button>
            <button class="player-nav-btn" id="btn-next" onclick="pick(vi+1)">Suivante →</button>
          </div>
        </div>
      </div>`;

    function renderList() {
      document.getElementById('vlist').innerHTML = f.videos.map((v,i) => `
        <div class="video-item ${i===vi?'active':''}" onclick="pick(${i})">
          <div class="vi-num">${i+1}</div>
          <div class="vi-title">${v.titre}</div>
          <div class="vi-dur">${v.dur}</div>
        </div>`).join('');
    }

    window.pick = function(i) {
      if (i < 0 || i >= f.videos.length) return;
      vi = i;
      document.getElementById('player').src = f.videos[i].url + '?autoplay=1';
      document.getElementById('player-label').textContent = f.videos[i].titre;
      document.getElementById('btn-prev').disabled = i === 0;
      document.getElementById('btn-next').disabled = i === f.videos.length - 1;
      renderList();
      document.querySelector('.detail-sidebar').scrollIntoView({behavior:'smooth', block:'start'});
    };

    renderList();
    document.getElementById('btn-next').disabled = f.videos.length <= 1;
  }

  afficherPage();
</script>
</body>
</html>
